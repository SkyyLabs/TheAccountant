name: CI

on:
  pull_request:
    branches: [dev, stage, prod]
  push:
    branches: [dev, stage, prod]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: make setup PYTHON=python3.12 EXTRAS=dev

      - name: Verify
        run: make verify
