[project]
name = "theaccountant-backend"
version = "0.1.0"
description = "Local, offline personal-finance backend for TheAccountant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.33",
    "pdfplumber==0.11.10",
    "keyring==25.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.0",
    "ruff==0.17.4",
    "fpdf2==2.9.0",
]

ocr = [
    "docling[ocrmac]==2.148.0; sys_platform == 'darwin'",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs the Docling models from `make models` (run with make test-models)"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
